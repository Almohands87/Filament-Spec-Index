name: Data correction
description: Report a value that contradicts a published datasheet
title: "[fix] "
labels: ["correction"]
body:
  - type: input
    id: material
    attributes:
      label: Material
      placeholder: PETG
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field
      placeholder: hdt / tensile / tg / zRatio / minHotend
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current value
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Link to the datasheet, and quote the figure and its test method
      placeholder: |
        https://example.com/tds.pdf — page 2, "Tensile strength (ISO 527): 50.8 MPa"
    validations:
      required: true
